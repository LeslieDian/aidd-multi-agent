schema_version: 1
name: feedback-memory-ablation-v4
base_config: ../config.yaml
description: >
  Exploratory four-arm ablation. Failure filtering and WorkingMemory are
  separate increments. The hypothesis that filtering explains earlier
  improvement is not a causal conclusion. Inherits safe_vina from config;
  this three-round design does not establish a benefit of early stopping.

execution:
  repeats: 3
  rounds: 3
  candidates_per_round_per_generator: 5
  primary_metric: best_composite_global

groups:
  baseline:
    description: Single generator without Judge, memory, or failed-set.
    overrides:
      loop:
        judge_enabled: false
        memory_enabled: false
        failed_set_enabled: false

  reflection:
    description: Judge feedback only. Exploratory feedback arm.
    overrides:
      loop:
        judge_enabled: true
        memory_enabled: false
        failed_set_enabled: false

  reflection_failed_set:
    description: >
      Judge + FailedLigandSet filter, no persistent memory.
      Isolates the deterministic re-emission guard from the memory layer.
    overrides:
      loop:
        judge_enabled: true
        memory_enabled: false
        failed_set_enabled: true

  reflection_memory:
    description: Judge + FailedLigandSet + WorkingMemory. v3 winner.
    overrides:
      loop:
        judge_enabled: true
        memory_enabled: true
        failed_set_enabled: true