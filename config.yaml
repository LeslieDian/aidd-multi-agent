# ============================================================
# AIDD Multi-Agent 配置文件
# ============================================================
# 使用前请复制为 config.local.yaml 并填入真实 API Key
# 或者用 .env 文件管理密钥（推荐，见 .env.example）

project:
  name: aidd-multi-agent
  version: "0.1.0"
  description: "Multi-Agent iterative loop for AI-Driven Drug Design"

# ----------------------------------------------------------
# 靶点配置（默认 EGFR，可换）
# ----------------------------------------------------------
target:
  name: EGFR
  pdb_id: "1M17"
  # 受体 PDB 文件路径（首次运行自动下载到 data/）
  receptor_pdb: data/1M17.pdb
  # 活性口袋中心（来自 PDB 1M17 原始配体 erlotinib）
  pocket:
    center_x: 11.0
    center_y: 17.0
    center_z: 28.0
    size_x: 22.0
    size_y: 22.0
    size_z: 22.0

# ----------------------------------------------------------
# LLM 模型配置（用于 Agent A 和 Agent C）
# ----------------------------------------------------------
llm:
  generators:
    - name: deepseek
      model: deepseek-chat
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      temperature: 0.7
      max_tokens: 2048
      weight: 0.5   # 多模型并行时的采样权重
    - name: qwen
      model: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: QWEN_API_KEY
      temperature: 0.7
      max_tokens: 2048
      weight: 0.5

  judge:
    name: deepseek
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.3   # 评判模型用更低的 temperature 求稳定
    max_tokens: 4096

# ----------------------------------------------------------
# 评分阈值（用于筛选）
# ----------------------------------------------------------
scoring:
  # Lipinski 五规则
  lipinski:
    max_mw: 500
    max_logp: 5
    max_hbd: 5
    max_hba: 10

  # SA score（合成难度，1=容易，10=几乎不可能合成）
  sa_score:
    reject_above: 6.0

  # Vina docking（kcal/mol，越负越好）
  vina:
    accept_below: -8.0
    exhaustiveness: 16
    n_poses: 5

  # 多样性（每轮至少要新增多少个新骨架）
  diversity:
    min_new_scaffolds: 2

# ----------------------------------------------------------
# 主循环配置
# ----------------------------------------------------------
loop:
  max_rounds: 5
  candidates_per_round: 5     # 每个 Agent A 一次输出几条 SMILES
  early_stop_patience: 2      # 连续 N 轮无提升则提前终止
  output_dir: runs/