# ============================================================
# AIDD Multi-Agent Configuration
# ============================================================
# Secrets (.env) are loaded by python-dotenv; see .env.example.
# NEVER put real keys in this file - it is tracked by git.

project:
  name: aidd-multi-agent
  version: "0.1.0"
  description: "Multi-Agent iterative loop for AI-Driven Drug Design"

# ----------------------------------------------------------
# Target (default EGFR; can be swapped)
# ----------------------------------------------------------
target:
  name: EGFR
  pdb_id: "1M17"
  receptor_pdbqt: data/prepared/1M17_v1.pdbqt   # generated by scripts/prepare_receptor.py
  # Pocket center = erlotinib (HET code AQ4) geometric center in 1M17.
  # Box = ligand extents + 6 A padding (chosen by scanning pad in {4,5,6}).
  # Center never changes with padding; size scales.
  # Generated via: python scripts/extract_ligand_center.py data/1M17.pdb AQ4
  # Adjust if you switch targets.
  pocket:
    center_x: 22.014
    center_y: 0.253
    center_z: 52.794
    size_x: 27.7
    size_y: 16.7
    size_z: 19.1

# ----------------------------------------------------------
# LLM providers
# ----------------------------------------------------------
# All providers use OpenAI-compatible protocol so we can share the
# same client class (agents/llm.py).
#
# Two generators (heterogeneous) + one judge (more deterministic).
#
llm:
  # Do not inherit Windows/system HTTP proxies by default; TLS verification remains enabled.
  trust_env_proxy: false
  judge: judge_MiniMax
  providers:
    # NOTE: this project intentionally does NOT call the DeepSeek API.
    # The OpenAI-compatible harness (LLMClient in agents/llm.py) supports
    # any base_url; to re-enable DeepSeek, uncomment the block below and
    # add it back to `generators`. Without DEEPSEEK_API_KEY in .env the
    # preflight in loop.py will fail closed before any HTTP call.
    #
    # ----- generator (optional): DeepSeek (strong reasoning, low cost) -----
    # deepseek:
    #   base_url: https://api.deepseek.com/v1
    #   api_key_env: DEEPSEEK_API_KEY
    #   model: deepseek-chat
    #   temperature: 0.7
    #   max_tokens: 2048

    # ----- generator A1: MiniMax M3 (MiniMax latest, 1M context) -----
    # NOTE: base_url is case-sensitive. Verified working endpoint (2026-09-13):
    #   https://api.minimaxi.com/v1     (international, this user's account)
    #   https://api.MiniMax.chat/v1    (may also work for other accounts)
    # OpenAI-compatible protocol.
    # 2026-09-21: api_key_env_fallbacks lists secondary keys so the LLMClient
    # can swap to the next account when the primary returns 429
    # rate_limit_error. The order is the order keys are tried.
    MiniMax:
      base_url: https://api.minimaxi.com/v1
      api_key_env: MiniMax_API_KEY
      api_key_env_fallbacks: [MiniMax_API_KEY_SECONDARY]
      model: MiniMax-M3
      temperature: 1.0          # recommended by MiniMax docs
      max_tokens: 2048
      # MiniMax-M3 specific: disable thinking for shorter SMILES-only output
      extra_body:
        thinking:
          type: disabled

    # ----- judge C: MiniMax-M3 thinking enabled (best reasoning) -----
    judge_MiniMax:
      base_url: https://api.minimaxi.com/v1
      api_key_env: MiniMax_API_KEY
      api_key_env_fallbacks: [MiniMax_API_KEY_SECONDARY]
      model: MiniMax-M3
      temperature: 0.3
      max_tokens: 4096
      extra_body:
        thinking:
          type: adaptive

    # ----- Phase 4.6: optional multi-model providers (commented by default) -----
    # Uncomment any block below AND add it to loop.multi_agent.generators[]
    # or loop.multi_agent.judges[] to enable real multi-model multi-agent.
    # Each provider block MUST define base_url + api_key_env + model;
    # the OpenAI-compatible client in agents/llm.py supports any of these.

    # ----- generator A2: DeepSeek (Volcengine Agent Plan; strong reasoning) -----
    # deepseek:
    #   base_url: https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions
    #   api_key_env: VOLCENGINE_AGENT_API_KEY
    #   model: deepseek-v4-flash
    #   temperature: 1.0
    #   max_tokens: 4096

    # ----- generator A3 / judge J3: Kimi K3 (Volcengine Agent Plan; 1M context) -----
    # kimi:
    #   base_url: https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions
    #   api_key_env: VOLCENGINE_AGENT_API_KEY
    #   model: kimi-k3
    #   temperature: 0.5
    #   max_tokens: 4096

    # ----- generator A_alt: GLM 5.3 (Volcengine Agent Plan; cost-effective) -----
    # glm:
    #   base_url: https://ark.cn-beijing.volces.com/api/plan/v3/chat/completions
    #   api_key_env: VOLCENGINE_AGENT_API_KEY
    #   model: glm-5.3
    #   temperature: 0.7
    #   max_tokens: 4096

  # Which providers to use as generators (round-robin or parallel).
  # 2026-09-17: single-provider mode — DeepSeek provider block is
  # commented out above; only MiniMax is active. To bring DeepSeek back,
  # uncomment its provider block and add `deepseek` to this list.
  generators:
    - MiniMax

# ----------------------------------------------------------
# Scoring thresholds
# ----------------------------------------------------------
scoring:
  # Confirmatory objective v3. Scores retain six decimal places internally.
  # Property quality, docking, and the continuous hERG proxy remain separate
  # so a strong docking score cannot silently erase a safety penalty.
  objective:
    version: multi_objective_v3.1
    precision: 6
    vina_scale: 12.0
    weak_vina_multiplier: 0.3
    weights:
      property: 0.55
      vina: 0.30
      herg_safety: 0.15

  pareto:
    enabled: true
    objectives:
      - vina
      - property_score
      - herg_risk_score
      - sa_score
    safety:
      max_herg_risk_score: 0.55
      max_logp: 4.50

  lipinski:
    max_mw: 500
    max_logp: 5
    max_hbd: 5
    max_hba: 10

  sa_score:
    reject_above: 6.0

  vina:
    accept_below: -7.0          # provisional triage threshold; not an affinity claim
    exhaustiveness: 16          # 8 for dev, 16+ for final
    n_poses: 5
    seed: 2026
    cpu: 2
    workers: 4                  # concurrent CPU-only Vina processes; each uses `cpu` threads
    timeout: 180

  # Two-stage docking is enabled by the screening profile, not by final confirmation.
  # All valid candidates receive a cheap Vina pass; only the safety/property/fast-Vina
  # leaders are promoted to the full protocol above.
  funnel:
    enabled: false
    full_dock_fraction: 0.35
    min_full_dock: 3
    max_full_dock: 0            # 0 = no absolute cap
    fast_vina:
      exhaustiveness: 4
      n_poses: 1
      seed: 2026
      cpu: 1
      workers: 4
      timeout: 60

  diversity:
    min_new_scaffolds: 2

  # Phase 4.3 (P2-1 fix): thresholds lifted from hard-coded defaults.
  # Different targets / pocket chemistries may need different "failure" cutoffs.
  failed_set:
    composite_floor: 0.5        # composite_score < this -> mark failed
    vina_floor: -2.5            # vina_score > this  -> mark failed (more negative = better)
    max_size: 500               # Phase 4.3 (P0-2 fix): LRF eviction cap; 0 = unlimited
    # Optional diagnostic similarity signal. all-MiniLM-L6-v2 is a text model,
    # so matches are reported for analysis and do not reject molecules.
    # Lazy model load; falls back silently to exact-match if
    # sentence-transformers / torch are unavailable.
    embeddings:
      enabled: true             # OPTED IN 2026-09-14: torch 2.11+cu128 + all-MiniLM-L6-v2 cached
      mode: report              # off | report | exclude; use exclude only after validation
      threshold: 0.85           # cosine sim >= this -> structurally too close
      model: all-MiniLM-L6-v2   # 384-dim, ~80 MB, fast on CPU
      device: auto              # uses CUDA when available, otherwise CPU

# ----------------------------------------------------------
# Loop configuration
# ----------------------------------------------------------
loop:
  # Phase 4.4 (2026-09-14): 5 -> 12 rounds. With 5 rounds x 2 providers x 5 mols
  # the search space was too small (best_Vina stalled around -3.0 kcal/mol).
  # 12 rounds lets FailedSet + Judge reflection + SAR-guided generation
  # actually close the loop instead of stopping after 2-3 weak improvements.
  max_rounds: 12
  # Phase 4.4 (2026-09-14): 5 -> 15 per provider. Total 30 candidates/round
  # gives FailedSet enough hard negatives to filter against by round 3-4,
  # and gives Judge enough signal to find a real structural weakness.
  candidates_per_round_per_generator: 15
  early_stop_patience: 3
  # Which per-round number the patience counter watches (2026-09-17):
  #   vina      - legacy: best docking score over EVERY docked candidate. This
  #               signal ignores the safety gate, so a molecule with excellent
  #               Vina and bad hERG/logP counts as progress and resets patience.
  #   safe_vina - preferred: best docking score among safety-gate-passing
  #               candidates only.
  # Measured on benchmarks/confirmatory_pareto_v3_1_20260916 the all-candidate
  # optimum had herg_risk 0.830 while a safety-passing molecule was only
  # 0.020 kcal/mol behind, so the hERG regression came from the progress signal,
  # not from an unavoidable docking/safety trade-off.
  # NOTE: this changes loop control flow, not scoring, so it is stamped into
  # manifest.json but deliberately kept OUT of `protocol_id` (evaluation caches
  # stay valid). Runs with different settings are not directly comparable.
  progress_signal: safe_vina
  # Phase 4.5 (2026-09-27, Priority A-3): selection operator bridge.
  # The PARENTS block injects the top-k safety-gated candidates (SMILES
  # + vina + hERG + weakness) into the generator user prompt so the
  # LLM has explicit structural anchors to mutate, instead of just
  # re-sampling its training distribution. Without this, the audit
  # numbers in docs/REVIEW_MINIMAX_ADVICE_20260917.md Section 0 apply
  # (P(random beats agent) ~= 65.8%).
  parents_block_enabled: true   # set to false to A/B test the LLM-only baseline
  parents_k: 3                  # how many top safety-gated parents to surface

  # ============================================================
  # Phase 4.6 (2026-09-29): Multi-Agent Collaboration
  # ============================================================
  # README narrative and code now target real multi-agent:
  #   - multi_agent.generators[] : heterogeneous generators (different
  #                    provider / model / prompt_role / temperature /
  #                    few_shot) running in parallel each round. They MUST
  #                    differ on at least one axis; otherwise the run
  #                    degrades to single-agent (and a warning is logged).
  #   - multi_agent.judges[]     : multi-judge vote (different prompt_role).
  #                    Each judge produces its own score; the aggregator
  #                    combines them via weighted vote. Different views =
  #                    different prompts.
  #   - multi_agent.router       : expert router activates prompt templates
  #                    based on the current round state.
  #   - multi_agent.debate       : adversarial generator <-> critic loop
  #                    when judges disagree or confidence is low.
  #   - multi_agent.aggregation  : dedup + diversity floor + voting +
  #                    top_n cutoff.
  #
  # Backwards compatible: if `multi_agent.generators` is empty or missing,
  # loop.py falls back to the legacy single-generator path
  # (`llm.generators` provider list). Same for `multi_agent.judges`.
  multi_agent:
    enabled: false              # master switch; default off (single-agent behavior)
    generators:
      # Default: single generator (current behavior). Replace with multi
      # for real multi-agent runs (see scripts/smoke_multi_agent.py).
      - name: A1_qed
        provider: MiniMax        # must match llm.providers.<key>
        model: MiniMax-M3
        prompt_role: qed         # loaded from agents/prompts/qed.j2 (Phase 4.6)
        temperature: 0.7
        weight: 1.0              # aggregation weight (per-generator confidence base)
      # ----- Real multi-agent template (3 generators) -----
      # Uncomment the block below (and the matching provider blocks at the
      # top of llm.providers) to enable 3-generator multi-agent.
      # All three MUST differ on prompt_role per README '5 roles' contract.
      # - name: A1_qed
      #   provider: MiniMax
      #   model: MiniMax-M3
      #   prompt_role: qed           # ADMET / QED / SA focus
      #   temperature: 0.7
      #   weight: 1.0
      # - name: A2_vina
      #   provider: deepseek
      #   model: deepseek-v4-flash
      #   prompt_role: vina          # docking / binding / scaffold focus
      #   temperature: 1.0
      #   weight: 1.0
      # - name: A3_synth
      #   provider: kimi
      #   model: kimi-k3
      #   prompt_role: synth         # synthesis / SA / commercial focus
      #   temperature: 0.5
      #   weight: 1.0

    judges:
      # Default: single judge (current behavior). Replace with multi for
      # real multi-agent runs.
      - name: J1_property
        provider: judge_MiniMax
        prompt_role: judge_property
        temperature: 0.3
        weight: 1.0
      # ----- Real multi-judge template (3 judges) -----
      # - name: J1_property
      #   provider: judge_MiniMax
      #   prompt_role: judge_property   # property / QED / SA / hERG
      #   temperature: 0.3
      #   weight: 1.0
      # - name: J2_docking
      #   provider: deepseek
      #   prompt_role: judge_docking    # Vina / binding mode / pose
      #   temperature: 0.3
      #   weight: 1.0
      # - name: J3_synthesis
      #   provider: kimi
      #   prompt_role: judge_synthesis  # synthesis / SA / commercial
      #   temperature: 0.3
      #   weight: 1.0

    router:
      enabled: false              # Phase 4.6 stage 5; default off
      experts:
        property_weak: prompt_qed_expert
        vina_weak:     prompt_vina_expert
        sa_difficult:  prompt_sa_expert
        ok:            prompt_exploit_expert

    debate:
      enabled: false              # Phase 4.6 stage 5; default off
      max_rounds: 3
      disagreement_threshold: 0.15   # max - median judge score gap
      confidence_floor: 0.30         # any judge below this triggers debate
      require_evidence_id: true

    aggregation:
      dedup: canonical            # canonical SMILES dedup
      diversity_floor: 0.7        # Tanimoto > 0.7 -> drop lower-ranked
      top_n: 12                   # how many candidates to evaluate per round
  output_dir: runs/
  memory_dir: memory/v2
  memory_namespace: default     # set a different name for each experiment arm
  judge_enabled: true
  memory_enabled: true
  failed_set_enabled: true
  # Controlled benchmarks override these to true/3. Interactive runs remain
  # resilient and can continue if one provider is temporarily unavailable.
  require_all_generators: false
  generation_max_attempts: 1
  judge_max_attempts: 1
  evaluation_cache_enabled: true
  # Shared across experiment arms; protocol_id prevents incompatible reuse.
  evaluation_cache_dir: memory/evaluation_cache
  docking_cache_enabled: true
  docking_cache_dir: memory/docking_cache

# Persistent task agent (agent_task.py); independent of the benchmark loop.
harness:
  # Persistent agent planner. The non-thinking MiniMax-M3 route reliably
  # returns the strict single-action JSON contract used by the harness.
  planner: MiniMax
  max_attempts: 3       # bounded transient retries for planner/generator (1..5)
  request_timeout: 60  # SDK request timeout in seconds; hidden SDK retries disabled
  # Bounded exponential backoff, owned by the Harness (never by the SDK).
  # delay(n) = min(retry_base_delay * 2**(n-1), retry_max_delay) + jitter;
  # a legal Retry-After header wins but is still clamped to retry_max_delay.
  retry_base_delay: 1.0
  retry_max_delay: 30.0
  retry_jitter: 0.25
