# ============================================================
# AIDD Multi-Agent Configuration
# ============================================================
# Secrets (.env) are loaded by python-dotenv; see .env.example.
# NEVER put real keys in this file - it is tracked by git.

project:
  name: aidd-multi-agent
  version: "0.1.0"
  description: "Multi-Agent iterative loop for AI-Driven Drug Design"

# ----------------------------------------------------------
# Target (default EGFR; can be swapped)
# ----------------------------------------------------------
target:
  name: EGFR
  pdb_id: "1M17"
  receptor_pdbqt: data/prepared/1M17_v1.pdbqt   # generated by scripts/prepare_receptor.py
  # Pocket center = erlotinib (HET code AQ4) geometric center in 1M17.
  # Box = ligand extents + 6 A padding (chosen by scanning pad in {4,5,6}).
  # Center never changes with padding; size scales.
  # Generated via: python scripts/extract_ligand_center.py data/1M17.pdb AQ4
  # Adjust if you switch targets.
  pocket:
    center_x: 22.014
    center_y: 0.253
    center_z: 52.794
    size_x: 27.7
    size_y: 16.7
    size_z: 19.1

# ----------------------------------------------------------
# LLM providers
# ----------------------------------------------------------
# All providers use OpenAI-compatible protocol so we can share the
# same client class (agents/llm.py).
#
# Two generators (heterogeneous) + one judge (more deterministic).
#
llm:
  judge: judge_MiniMax
  providers:
    # ----- generator A1: DeepSeek (strong reasoning, low cost) -----
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
      temperature: 0.7
      max_tokens: 2048

    # ----- generator A2: MiniMax M3 (MiniMax latest, 1M context) -----
    # NOTE: base_url is case-sensitive. Verified working endpoint (2026-09-13):
    #   https://api.minimaxi.com/v1     (international, this user's account)
    #   https://api.MiniMax.chat/v1    (may also work for other accounts)
    # OpenAI-compatible protocol.
    MiniMax:
      base_url: https://api.minimaxi.com/v1
      api_key_env: MiniMax_API_KEY
      model: MiniMax-M3
      temperature: 1.0          # recommended by MiniMax docs
      max_tokens: 2048
      # MiniMax-M3 specific: disable thinking for shorter SMILES-only output
      extra_body:
        thinking:
          type: disabled

    # ----- judge C: MiniMax-M3 thinking enabled (best reasoning) -----
    judge_MiniMax:
      base_url: https://api.minimaxi.com/v1
      api_key_env: MiniMax_API_KEY
      model: MiniMax-M3
      temperature: 0.3
      max_tokens: 4096
      extra_body:
        thinking:
          type: adaptive

  # Which providers to use as generators (round-robin or parallel)
  # Both providers working now (MiniMax base_url fixed).
  generators:
    - deepseek
    - MiniMax

# ----------------------------------------------------------
# Scoring thresholds
# ----------------------------------------------------------
scoring:
  # Confirmatory objective v3. Scores retain six decimal places internally.
  # Property quality, docking, and the continuous hERG proxy remain separate
  # so a strong docking score cannot silently erase a safety penalty.
  objective:
    version: multi_objective_v3.1
    precision: 6
    vina_scale: 12.0
    weak_vina_multiplier: 0.3
    weights:
      property: 0.55
      vina: 0.30
      herg_safety: 0.15

  pareto:
    enabled: true
    objectives:
      - vina
      - property_score
      - herg_risk_score
      - sa_score
    safety:
      max_herg_risk_score: 0.55
      max_logp: 4.50

  lipinski:
    max_mw: 500
    max_logp: 5
    max_hbd: 5
    max_hba: 10

  sa_score:
    reject_above: 6.0

  vina:
    accept_below: -7.0          # provisional triage threshold; not an affinity claim
    exhaustiveness: 16          # 8 for dev, 16+ for final
    n_poses: 5
    seed: 2026
    cpu: 2
    timeout: 180

  diversity:
    min_new_scaffolds: 2

  # Phase 4.3 (P2-1 fix): thresholds lifted from hard-coded defaults.
  # Different targets / pocket chemistries may need different "failure" cutoffs.
  failed_set:
    composite_floor: 0.5        # composite_score < this -> mark failed
    vina_floor: -2.5            # vina_score > this  -> mark failed (more negative = better)
    max_size: 500               # Phase 4.3 (P0-2 fix): LRF eviction cap; 0 = unlimited
    # Optional diagnostic similarity signal. all-MiniLM-L6-v2 is a text model,
    # so matches are reported for analysis and do not reject molecules.
    # Lazy model load; falls back silently to exact-match if
    # sentence-transformers / torch are unavailable.
    embeddings:
      enabled: true             # OPTED IN 2026-09-14: torch 2.11+cu128 + all-MiniLM-L6-v2 cached
      mode: report              # off | report | exclude; use exclude only after validation
      threshold: 0.85           # cosine sim >= this -> structurally too close
      model: all-MiniLM-L6-v2   # 384-dim, ~80 MB, fast on CPU

# ----------------------------------------------------------
# Loop configuration
# ----------------------------------------------------------
loop:
  # Phase 4.4 (2026-09-14): 5 -> 12 rounds. With 5 rounds x 2 providers x 5 mols
  # the search space was too small (best_Vina stalled around -3.0 kcal/mol).
  # 12 rounds lets FailedSet + Judge reflection + SAR-guided generation
  # actually close the loop instead of stopping after 2-3 weak improvements.
  max_rounds: 12
  # Phase 4.4 (2026-09-14): 5 -> 15 per provider. Total 30 candidates/round
  # gives FailedSet enough hard negatives to filter against by round 3-4,
  # and gives Judge enough signal to find a real structural weakness.
  candidates_per_round_per_generator: 15
  early_stop_patience: 3
  output_dir: runs/
  memory_dir: memory/v2
  memory_namespace: default     # set a different name for each experiment arm
  judge_enabled: true
  memory_enabled: true
  failed_set_enabled: true
  # Controlled benchmarks override these to true/3. Interactive runs remain
  # resilient and can continue if one provider is temporarily unavailable.
  require_all_generators: false
  generation_max_attempts: 1
  judge_max_attempts: 1
  evaluation_cache_enabled: true
  # Shared across experiment arms; protocol_id prevents incompatible reuse.
  evaluation_cache_dir: memory/evaluation_cache
  docking_cache_enabled: true
  docking_cache_dir: memory/docking_cache
