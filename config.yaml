# ============================================================
# AIDD Multi-Agent Configuration
# ============================================================
# Secrets (.env) are loaded by python-dotenv; see .env.example.
# NEVER put real keys in this file - it is tracked by git.

project:
  name: aidd-multi-agent
  version: "0.1.0"
  description: "Multi-Agent iterative loop for AI-Driven Drug Design"

# ----------------------------------------------------------
# Target (default EGFR; can be swapped)
# ----------------------------------------------------------
target:
  name: EGFR
  pdb_id: "1M17"
  receptor_pdbqt: data/1M17.pdbqt   # generated by scripts/prepare_receptor.py
  # Pocket center = erlotinib (HET code AQ4) geometric center in 1M17.
  # Box = ligand extents + 6 A padding (chosen by scanning pad in {4,5,6}).
  # Center never changes with padding; size scales.
  # Generated via: python scripts/extract_ligand_center.py data/1M17.pdb AQ4
  # Adjust if you switch targets.
  pocket:
    center_x: 22.014
    center_y: 0.253
    center_z: 52.794
    size_x: 27.7
    size_y: 16.7
    size_z: 19.1

# ----------------------------------------------------------
# LLM providers
# ----------------------------------------------------------
# All providers use OpenAI-compatible protocol so we can share the
# same client class (agents/llm.py).
#
# Two generators (heterogeneous) + one judge (more deterministic).
#
llm:
  providers:
    # ----- generator A1: DeepSeek (strong reasoning, low cost) -----
    deepseek:
      base_url: https://api.deepseek.com/v1
      api_key_env: DEEPSEEK_API_KEY
      model: deepseek-chat
      temperature: 0.7
      max_tokens: 2048

    # ----- generator A2: MiniMax M3 (MiniMax latest, 1M context) -----
    # OpenAI-compatible endpoint.
    MiniMax:
      base_url: https://api.minimax.io/v1
      api_key_env: MiniMax_API_KEY
      model: MiniMax-M3
      temperature: 1.0          # recommended by MiniMax docs
      max_tokens: 2048
      # MiniMax-M3 specific: disable thinking for shorter SMILES-only output
      extra_body:
        thinking:
          type: disabled

    # ----- judge C: MiniMax-M3 thinking enabled (best reasoning) -----
    judge_MiniMax:
      base_url: https://api.minimax.io/v1
      api_key_env: MiniMax_API_KEY
      model: MiniMax-M3
      temperature: 0.3
      max_tokens: 4096
      extra_body:
        thinking:
          type: adaptive

  # Which providers to use as generators (round-robin or parallel)
  # Note: MiniMax currently returns 401 (key issue); using deepseek-only until fixed.
  generators:
    - deepseek
    # - MiniMax  # temporarily disabled (401 auth error)

# ----------------------------------------------------------
# Scoring thresholds
# ----------------------------------------------------------
scoring:
  lipinski:
    max_mw: 500
    max_logp: 5
    max_hbd: 5
    max_hba: 10

  sa_score:
    reject_above: 6.0

  vina:
    accept_below: -3.0          # kcal/mol threshold (with +6 A box; tighten to -7.0 for tighter boxes)
    exhaustiveness: 16          # 8 for dev, 16+ for final
    n_poses: 5

  diversity:
    min_new_scaffolds: 2

# ----------------------------------------------------------
# Loop configuration
# ----------------------------------------------------------
loop:
  max_rounds: 5
  candidates_per_round_per_generator: 5
  early_stop_patience: 2
  output_dir: runs/